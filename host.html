<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altitude · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.side{position:absolute;right:4vw;top:50%;transform:translateY(-50%);width:min(640px,42vw);max-height:84vh;overflow:auto}
.side h2{font-size:clamp(30px,2.6vw,44px);font-weight:700;margin:10px 0 8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.qrbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin:18px 0}
.qr{background:#fff;padding:10px;border-radius:16px;width:max-content}
.qr img,.qr canvas{display:block;width:190px!important;height:190px!important}
.code{font-size:52px;font-weight:800;letter-spacing:.08em;color:var(--lime);line-height:1}
.url{font-size:17px;color:#c9d0de;word-break:break-all;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px;max-height:150px;overflow:auto}
.chips span{background:#0e121b;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:15px;display:flex;gap:7px;align-items:center}
.chips span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.count{width:84px;height:84px;border-radius:50%;background:#0e121b;border:1px solid var(--line);display:grid;place-items:center;font-size:44px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#2a3140;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;background:var(--lime);transition:width .4s}
.ans{font-size:clamp(56px,5vw,84px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:12px 0 10px}
.fact{font-size:20px;margin:0 0 6px}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;font-size:15px;padding:8px 0}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:14px}.words b{color:#dfe5f0}
.final{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1000px,94vw);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:32px;padding:30px 34px;box-shadow:0 30px 80px #0008;max-height:94vh;overflow:auto}
.final h2{font-size:clamp(32px,3.2vw,50px);margin-top:10px;min-height:1.1em}
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end;margin:22px 0 6px}
.slot{opacity:0;transform:translateY(40px) scale(.96);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.3,1.2);display:flex;flex-direction:column;align-items:center}
.slot.in{opacity:1;transform:none}
.slot svg{width:min(170px,80%);height:auto;margin-bottom:-6px;filter:drop-shadow(0 10px 12px #0008)}
.blk{width:100%;background:#0e121b;border:1px solid var(--line);border-radius:22px 22px 8px 8px;padding:16px 12px}
.blk b{display:block;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:2px 0}
.blk .alt{color:var(--soft);font-size:17px;font-variant-numeric:tabular-nums}
.medal{font-weight:800;font-size:15px;letter-spacing:.14em;color:#cfd6e2}
.p1 .blk{min-height:180px;border-color:var(--lime);box-shadow:0 0 50px #d7f25c30}.p1 .medal{color:var(--lime)}.p1 .blk b{font-size:30px}
.p2 .blk{min-height:140px}.p3 .blk{min-height:110px}.p3 .medal{color:#e0a06a}
.board{opacity:0;transition:opacity .8s;text-align:left;margin-top:16px;display:grid;gap:0 28px}.board.in{opacity:1}.board.two{grid-template-columns:1fr 1fr}
.br{display:grid;grid-template-columns:28px 10px minmax(0,1fr) minmax(0,1.2fr) 82px;gap:12px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:16px}
.br .rk{color:var(--soft);font-variant-numeric:tabular-nums}.br .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.br .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br .bar{height:6px;background:#2a3140;border-radius:3px;overflow:hidden}.br .bar i{display:block;height:100%;background:var(--c)}
.br .m{text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.story{position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at 50% 40%,#151b28cc,#0b0e15f2 75%)}
.wall{position:absolute;inset:0}
.hero{position:absolute;inset:0;overflow:hidden}
.hbg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.4)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:heroIn 1.6s cubic-bezier(.2,.8,.2,1) forwards,kb 24s ease-out 1.6s forwards}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#0b0e1599 100%),linear-gradient(transparent 70%,#0b0e15b0);pointer-events:none}
@keyframes heroIn{from{opacity:0;transform:scale(1.12);filter:blur(14px) brightness(.6)}to{opacity:1;transform:scale(1);filter:none}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.pol{position:absolute;margin:0;background:#f7f4ec;padding:12px 12px 0;border-radius:3px;box-shadow:0 18px 40px #000a,0 2px 6px #0006;
  transform:translate(-50%,-50%) rotate(var(--r));opacity:0;animation:drop .9s cubic-bezier(.2,.9,.25,1.15) var(--d) forwards,float 7s ease-in-out calc(var(--d) + 1s) infinite alternate}
.pol img{display:block;max-width:calc(var(--w) - 24px);max-height:calc(var(--h) - 56px);width:auto;height:auto;object-fit:cover;filter:saturate(1.05) contrast(1.02)}
.pol figcaption{font-family:'Caveat',cursive;font-size:clamp(20px,1.7vw,30px);color:#2a2622;text-align:center;line-height:1;padding:10px 4px 12px;min-height:44px}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(-3deg);background:#f3e9c6b0;box-shadow:0 1px 2px #0002}
@keyframes drop{from{opacity:0;transform:translate(-50%,-62%) rotate(calc(var(--r) * 3)) scale(1.25)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
@keyframes float{from{margin-top:0}to{margin-top:-6px}}
.cap{position:absolute;left:4vw;bottom:4vh;z-index:2;background:#0e121bcc;border:1px solid var(--line);border-radius:22px;padding:14px 22px;backdrop-filter:blur(8px)}
.capa{font-size:clamp(40px,4.4vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:4px}.capa span{font-size:.45em;font-weight:700}
.nxs{position:absolute;right:4vw;bottom:4vh;z-index:2;opacity:.7}.nxs:hover{opacity:1}.nxs:hover{opacity:1}
.ph{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}.thumbs>span{position:relative}
.thumbs img{width:120px;height:90px;object-fit:cover;border-radius:10px;display:block}
.thumbs .pc{display:block;width:120px;margin-top:6px;background:#0e121b;border:1px solid #3a4252;border-radius:8px;color:var(--ink);font-size:13px;padding:6px 8px}
.thumbs button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:#0e121b;color:#fff;font-size:16px;line-height:1}
@media (prefers-reduced-motion:reduce){.pol,.hero img{animation:none;opacity:1}}
.snd{background:none;border:0;color:var(--soft);display:grid;place-items:center;padding:4px;min-height:32px}
/* setup */
.page{position:fixed;inset:0;overflow:auto;z-index:6;background:#0f131cf0}
.wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}
.q{margin-top:16px;display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.q label{display:grid;gap:6px;font-size:14px;color:var(--soft);font-weight:500}
.q .field{font-size:16px;min-height:48px;padding:10px 14px;border-radius:12px}
.chk{display:flex!important;align-items:center;gap:10px;grid-auto-flow:column}
.chk input{width:22px;height:22px;accent-color:var(--orange)}
.warn{background:#3a2412;border:1px solid #7a4f2e;color:#ffd2ab;border-radius:14px;padding:12px 16px;margin-top:16px;font-size:15px}
</style>
</head>
<body>
<div id="scene"></div>
<div class="ui" id="ui"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
{
const {$, esc, fmt, ls} = U;
const net = U.net();
const scene = U.scene($('#scene'), {area:[.05,.52]});
const ui = $('#ui');

const DEFAULT_Q = [
  {id:'q1', type:'number', prompt:'How many schools did I attend before I turned 10?', answer:'', unit:'schools', fact:'New country, new school, new friends, sometimes a new language. I learned to adapt fast.', accept:'', near:'', golden:false},
  {id:'q2', type:'number', prompt:'On average, how many hours a week did I play tennis?', answer:'', unit:'hours a week', fact:'Tennis taught me discipline and drive, and it still shapes how I work.', accept:'', near:'', golden:false},
  {id:'q3', type:'word', prompt:'What is one of my favourite hobbies outside sport?', answer:'building projects with AI', unit:'a few words', fact:'Building projects with AI, like the game you just played: made with Claude, 674 lines of code.', accept:'ai, artificial intelligence, building, build, coding, code, programming, developing, apps, websites, vibe coding, claude, chatgpt, tech, technology, projects, computers', near:'gaming, video games, investing, trading, finance, business, startups, entrepreneurship, chess, reading, music, design', golden:true}
];
let Q = ls.get('alt_q4', DEFAULT_Q), secs = ls.get('alt_secs', 20);
let S = ls.get('alt_host', null) || {phase:'setup'};
Q.forEach(q => { if (!q.id) q.id = U.rid(6) });

/* photos: kept in this browser only (IndexedDB), never uploaded */
const IDB = { db: null,
  open(){ return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('altitude', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) })) },
  async get(k){ const db = await this.open(); return new Promise(res => { const t = db.transaction('photos').objectStore('photos').get(k); t.onsuccess = () => res(t.result || []); t.onerror = () => res([]) }) },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const t = db.transaction('photos','readwrite'); t.objectStore('photos').put(v, k); t.oncomplete = res; t.onerror = res }) } };
const PH = {}; // qid -> [{u, cap}]
const norm1 = x => x instanceof Blob ? {b:x, cap:''} : x;
async function loadPhotos(){ for (const q of Q) { const items = (await IDB.get(q.id)).map(norm1); (PH[q.id]||[]).forEach(p => URL.revokeObjectURL(p.u)); PH[q.id] = items.map(it => ({u:URL.createObjectURL(it.b), cap:it.cap||''})) } }
function shrink(file){ return new Promise(res => { const img = new Image(), u = URL.createObjectURL(file); img.onload = () => { const k = Math.min(1, 2000/Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => res(b), 'image/jpeg', .86) }; img.onerror = () => { URL.revokeObjectURL(u); res(null) }; img.src = u }) }
const BUNDLED = {q1: 'story-round1.jpg'}; // built into the site, so it works on any computer
Object.values(BUNDLED).forEach(src => { const i = new Image(); i.src = src });
const hasStory = q => q && ((PH[q.id]||[]).length > 0 || !!BUNDLED[q.id]);
let P = {}, A = {}, unsubA = null, unsubP = null;
const saveS = () => ls.set('alt_host', S), saveQ = () => { ls.set('alt_q4', Q); ls.set('alt_secs', secs) };
const base = () => location.href.replace(/host\.html.*$/,'').replace(/[?#].*$/,'');
const joinUrl = () => base() + '#' + S.code;
const G = p => `games/${S.code}/${p}`;

const pilots = () => { const o = {}; Object.entries(P).forEach(([id,p]) => { if (p && p.name) o[id] = {name:String(p.name).slice(0,18)} }); Object.entries(S.bots||{}).forEach(([id,b]) => o[id] = b); return o };
const planeList = (gains) => Object.entries(pilots()).map(([id,p]) => ({id, name:p.name, alt:(S.alts||{})[id]||0, gain:gains?((S.res||{})[id]||{}).gain:null}));
const ranked = () => Object.entries(pilots()).map(([id,p]) => ({id, name:p.name, alt:(S.alts||{})[id]||0})).sort((a,b) => b.alt - a.alt);

function listen(){
  if (unsubP) unsubP(); if (unsubA) unsubA();
  if (!S.code) return;
  unsubP = net.on(G('players'), v => { const b = Object.keys(P).length; P = v || {}; if (S.phase === 'lobby' && Object.keys(P).length > b) U.sfx.pop(); render() });
  if (S.phase === 'q') unsubA = net.on(G('answers/'+S.qi), v => { const b = Object.keys(A).length; A = v || {}; if (Object.keys(A).length > b) U.sfx.soft(); render() });
}
function publish(){
  if (!S.code) return;
  const q = Q[S.qi];
  const board = {}; ranked().forEach((p,i) => { const r = (S.res||{})[p.id] || {}; board[p.id] = {alt:p.alt, gain:r.gain ?? null, tier:r.tier || '', a:r.a ?? null, rank:i+1} });
  net.set(G('state'), {phase:S.phase, qi:S.qi ?? -1, n:Q.length, endsAt:S.endsAt||0, dur:secs*1000, total:Object.keys(pilots()).length,
    q: q && S.phase !== 'lobby' ? {prompt:q.prompt, unit:q.unit||'', type:q.type} : null,
    reveal: q && (S.phase === 'reveal' || S.phase === 'final') ? {answer:U.showAns(q,q.answer), unit:q.unit||'', fact:q.fact||'', golden:!!q.golden} : null,
    board});
}

/* ---------- flow ---------- */
function openLobby(){
  const code = Array.from(crypto.getRandomValues(new Uint8Array(4)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[b % 24]).join('');
  S = {phase:'lobby', code, qi:-1, alts:{}, res:{}, bots:{}, endsAt:0, qStart:0};
  saveS(); listen(); publish(); render();
}
function start(i){
  S.qi = i; S.phase = 'q'; S.qStart = net.now(); S.endsAt = S.qStart + secs*1000; S.res = {}; A = {};
  saveS(); listen(); publish(); botsAnswer(); render();
  if (i === 0) { U.sfx.takeoff(); U.sfx.hum(true) } else U.sfx.whoosh();
}
function reveal(){
  if (S.phase !== 'q') return;
  const q = Q[S.qi]; S.phase = 'reveal'; S.res = {};
  Object.keys(pilots()).forEach(id => {
    const ans = A[id] || (S.botA||{})[id], a = ans ? ans.a : null;
    const r = U.score(q, a), el = ans ? Math.max(0, ((ans.t||S.qStart) - S.qStart)/1000) : secs;
    const sink = a == null ? 108 : Math.min(108, Math.max(0, (el-3)*4));
    const gain = Math.round(r.pts*10*(q.golden?2:1) - sink);
    S.alts[id] = Math.max(0, Math.min(10000, (S.alts[id]||0) + gain));
    S.res[id] = {a, tier:r.tier, gain};
  });
  S.botA = {}; saveS(); if (unsubA) { unsubA(); unsubA = null } publish(); render();
  const order = ['Dialed','Close','Warm','Cold','Miss','No answer'], best = Object.values(S.res).map(r => r.tier).sort((a,b) => order.indexOf(a) - order.indexOf(b))[0] || 'Miss';
  U.sfx.reveal(); setTimeout(() => U.sfx.whoosh(), 200); setTimeout(() => U.sfx.tier(best), 900);
}
function story(){ S.phase = 'story'; saveS(); publish(); render(); U.sfx.whoosh() }
function advance(){ if (S.phase === 'reveal' && hasStory(Q[S.qi])) story(); else next() }
function next(){ if (S.qi + 1 < Q.length) start(S.qi + 1); else { S.phase = 'final'; finalBuilt = false; U.sfx.hum(false); saveS(); publish(); render() } }
let finalBuilt = false, lastTick = null, storyFor = null, slideT = null;

const BOTS = ['Maverick','Goose','Amelia','Wilbur','Skye','Orville'];
function addBots(){ S.bots = S.bots || {}; BOTS.forEach(n => S.bots['bot_'+n] = {name:n+' (test)'}); saveS(); publish(); render() }
function botsAnswer(){
  const q = Q[S.qi], qi = S.qi; S.botA = {};
  Object.keys(S.bots||{}).forEach(id => { const d = 1500 + Math.random()*(secs*800);
    setTimeout(() => { if (S.phase !== 'q' || S.qi !== qi) return; let a;
      if (q.type === 'word') { const pool = [q.answer, ...String(q.near).split(','), 'football', 'golf'].map(s => s.trim()).filter(Boolean); a = pool[Math.floor(Math.random()*pool.length)] }
      else { const t = U.parseNum(q.answer); a = String(q.type==='year' ? Math.round(t + (Math.random()-.5)*12) : Math.max(1, Math.round(t*Math.exp((Math.random()-.5)*1.4)))) }
      S.botA[id] = {a, t:S.qStart + d}; render() }, d) });
}

setInterval(() => {
  if (S.phase !== 'q') return;
  const left = Math.ceil((S.endsAt - net.now())/1000), ids = Object.keys(pilots());
  const done = ids.length > 0 && ids.every(id => A[id] || (S.botA||{})[id]);
  if (left <= 0 || done) return setTimeout(reveal, done && left > 0 ? 700 : 0);
  const c = $('#count'); if (c) c.textContent = left;
  if (left <= 5 && left !== lastTick) { lastTick = left; U.sfx.tick(left <= 1) }
}, 250);

/* ---------- render ---------- */
function hud(){
  const r = ranked(), lead = r[0];
  const segs = Q.map((_,i) => `<i class="${i < S.qi || (i === S.qi && S.phase !== 'q') ? 'on' : i === S.qi ? 'now' : ''}"></i>`).join('');
  return `<div class="hud"><span class="logo" style="font-size:22px">Altitude<span>.</span></span><div class="segs">${segs}</div>
    ${lead && lead.alt > 0 ? `<span class="muted">Leader</span><b>${esc(lead.name)} · ${fmt(lead.alt)} m</b>` : ''}<span class="muted">${r.length} pilots</span><button class="snd" id="snd" aria-label="Sound">${U.speakerSVG(U.sfx.muted)}</button></div>`;
}
function render(){
  if (S.phase === 'setup') { scene.setPlanes([]); return renderSetup() }
  const pl = pilots(), n = Object.keys(pl).length, q = Q[S.qi];
  if (S.phase === 'lobby') {
    scene.setPlanes(planeList(false));
    ui.innerHTML = `<div class="side card"><div class="top"><span class="lbl">Boarding · ${n} on the runway</span><span class="logo" style="font-size:26px">Altitude<span>.</span></span></div>
      <h2>How well do you know Rafael?</h2><p class="muted" style="margin:0;font-size:18px">${Q.length} questions about me, ${secs} seconds each. Closer climbs higher; the highest plane wins.</p>
      <div class="qrbox"><div class="qr" id="qr"></div><div><div class="lbl">Scan or go to</div><div class="url">${esc(joinUrl().replace(/^https?:\/\//,''))}</div><div class="lbl" style="margin-top:14px">Flight code</div><div class="code">${esc(S.code)}</div></div></div>
      <div class="chips">${Object.entries(pl).map(([id,p]) => `<span style="--c:${U.color(id)}">${esc(p.name)}</span>`).join('') || '<span class="muted" style="border:0;background:none;padding:0">Waiting for the first pilot…</span>'}</div>
      <button class="btn" id="go" style="width:100%" ${n ? '' : 'disabled'}>${n ? 'Take off' : 'Waiting for pilots'}</button>
      <div class="row" style="justify-content:space-between;margin-top:6px"><button class="link" id="bots">Add test players</button><button class="link" id="edit">Edit questions</button></div>
      ${net.live ? '' : '<div class="warn">Offline rehearsal mode: phones can\'t join until Firebase is connected in config.js.</div>'}</div>`;
    try { new QRCode($('#qr'), {text:joinUrl(), width:380, height:380, colorDark:'#0f131c', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M}) } catch(e) { $('#qr').textContent = 'QR unavailable' }
    $('#go').onclick = () => start(0); $('#bots').onclick = addBots; $('#edit').onclick = () => { S.phase = 'setup'; saveS(); render() };
  } else if (S.phase === 'q') {
    scene.setPlanes(planeList(false));
    const k = Object.keys(pl).filter(id => A[id] || (S.botA||{})[id]).length;
    ui.innerHTML = hud() + `<div class="side card"><div class="top"><span class="lbl">Round ${S.qi+1} of ${Q.length}</span><span class="lbl">${q.golden ? '' : esc(q.unit)}</span></div>
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start;justify-content:space-between;gap:20px"><h2>${esc(q.prompt)}</h2><div class="count" id="count">${Math.max(0, Math.ceil((S.endsAt - net.now())/1000))}</div></div>
      <p class="muted" style="margin:0;font-size:18px">${q.type === 'word' ? 'Answer in a few words' : q.type === 'year' ? 'Answer with a year' : 'Answer in ' + esc(q.unit || 'a number')}</p>
      <div class="bar"><i style="width:${n ? k/n*100 : 0}%"></i></div>
      <div class="row" style="justify-content:space-between;margin-top:10px"><span class="muted">${k} of ${n} locked in</span><button class="link" id="rv">Reveal now</button></div></div>`;
    $('#rv').onclick = reveal;
  } else if (S.phase === 'reveal') {
    scene.setPlanes(planeList(true));
    const rows = Object.entries(S.res).map(([id,r]) => ({id, name:(pl[id]||{}).name || 'Pilot', ...r})).sort((a,b) => b.gain - a.gain);
    let words = '';
    if (q.type === 'word') { const c = {}; rows.forEach(r => { const w = U.norm(r.a); if (w) c[w] = (c[w]||0) + 1 });
      const m = Math.max(1, ...Object.values(c)); words = `<div class="words">${Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0,16).map(([w,k]) => `<b style="font-size:${15+20*k/m}px;opacity:${.5+.5*k/m}">${esc(w)}</b>`).join('')}</div>` }
    ui.innerHTML = hud() + `<div class="side card"><div class="top"><span class="lbl">Round ${S.qi+1} · The answer</span>${q.golden ? '<span class="lbl" style="color:var(--lime)">Golden round · ×2</span>' : ''}</div>
      <div class="ans">${esc(U.showAns(q, q.answer))} <span style="font-size:.5em;font-weight:700">${esc(q.type==='word'?'':q.unit)}</span></div>
      ${q.fact ? `<p class="fact">${esc(q.fact)}</p>` : ''}<p class="muted" style="margin:0">${esc(q.prompt)}</p>${words}
      <div class="rows">${rows.slice(0,5).map(r => `<div class="r" style="--c:${U.color(r.id)}"><span class="dot"></span><span class="nm">${esc(r.name)}</span><span>${r.a == null ? '<span class="muted">No answer</span>' : esc(U.showAns(q, r.a))}</span><span class="tier t-${r.tier.split(' ')[0]}">${esc(r.tier)}</span><span class="g ${r.gain<0?'neg':''}">${r.gain>=0?'+':''}${fmt(r.gain)} m</span></div>`).join('')}</div>
      ${rows.length > 5 ? `<p class="muted" style="margin:10px 0 0">+ ${rows.length-5} more pilots</p>` : ''}
      <button class="btn" id="nx" style="width:100%;margin-top:18px">${hasStory(q) ? 'Tell the story' : S.qi + 1 < Q.length ? 'Next round' : 'See who landed first'}</button><p class="muted" style="margin:10px 0 0;font-size:14px;text-align:center">Space or → also works</p></div>`;
    $('#nx').onclick = advance;
  } else if (S.phase === 'story') {
    scene.setPlanes(planeList(false));
    if (storyFor === S.qi && $('#story')) return; storyFor = S.qi;
    const hero = BUNDLED[q.id], ph = hero ? [] : (PH[q.id] || []), n = ph.length;
    const cols = n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 2 : n <= 6 ? 3 : 4, rows = Math.ceil(n / cols);
    const cw = 92 / cols, ch = 74 / rows;
    const cards = ph.map((p, i) => { const r = Math.floor(i / cols), c = i % cols, inRow = Math.min(cols, n - r*cols), off = (cols - inRow) * cw / 2;
      const x = 4 + off + c*cw + cw/2 + (((i*37)%7) - 3) * .5, y = 6 + r*ch + ch/2 + (((i*53)%5) - 2) * .6, rot = (((i*71)%13) - 6) * .9;
      return `<figure class="pol" style="left:${x}%;top:${y}%;--r:${rot}deg;--d:${.35 + i*.9}s;--w:${cw*.86}vw;--h:${ch*.82}vh"><i class="tape"></i><img src="${p.u}" alt="">${p.cap ? `<figcaption>${esc(p.cap)}</figcaption>` : '<figcaption></figcaption>'}</figure>` }).join('');
    ui.innerHTML = `<div class="story" id="story">${hero ? `<div class="hero"><div class="hbg" style="background-image:url('${hero}')"></div><img src="${hero}" alt=""></div>` : ''}<div class="wall">${cards}</div>
      <div class="cap"><span class="lbl">Round ${S.qi+1} · The story</span><div class="capa">${esc(U.showAns(q, q.answer))} <span>${esc(q.type==='word'?'':q.unit)}</span></div></div>
      <button class="btn ghost nxs" id="nxs">${S.qi + 1 < Q.length ? 'Next round' : 'See who landed first'} →</button></div>`;
    $('#nxs').onclick = next;
    ph.forEach((_, i) => setTimeout(() => { if (S.phase === 'story') U.sfx.soft() }, (.35 + i*.9)*1000 + 350));
  } else if (S.phase === 'final') {
    const r = ranked(); scene.setPlanes(r.slice(0,12));
    if (finalBuilt) return; if (!r.length) { ui.innerHTML = '<div class="final"><span class="lbl">Landed</span><h2>Counting the pilots…</h2></div>'; return } finalBuilt = true;
    const max = Math.max(1, ...r.map(p => p.alt));
    const slot = (p, cls, medal) => p ? `<div class="slot ${cls}" style="--c:${U.color(p.id)}">${U.planeSVG(U.color(p.id))}<div class="blk"><div class="medal">${medal}</div><b>${esc(p.name)}</b><div class="alt" data-to="${p.alt}">0 m</div></div></div>` : '<div></div>';
    ui.innerHTML = `<div class="final"><span class="lbl">Landed · ${r.length} pilots</span>
      <h2 id="fh">And the pilot who knows Rafael best is…</h2>
      <div class="pod">${slot(r[1],'p2','2nd')}${slot(r[0],'p1','1st')}${slot(r[2],'p3','3rd')}</div>
      <div class="board ${r.length > 9 ? 'two' : ''}" id="board">${r.slice(3,23).map((p,i) => `<div class="br" style="--c:${U.color(p.id)}"><span class="rk">${i+4}</span><span class="dot"></span><span class="nm">${esc(p.name)}</span><span class="bar"><i style="width:${p.alt/max*100}%"></i></span><span class="m">${fmt(p.alt)} m</span></div>`).join('')}</div>
      <button class="link" id="again">New game</button></div>`;
    $('#again').onclick = () => { if (S.code) net.remove('games/' + S.code); S = {phase:'setup'}; saveS(); listen(); render() };
    const show = (cls, snd) => { const el = ui.querySelector('.slot.' + cls); if (!el) return; el.classList.add('in'); snd();
      const a = el.querySelector('.alt'), to = +a.dataset.to, t0 = performance.now();
      (function f(t){ const k = Math.min(1, (t - t0)/1100); a.textContent = fmt(to * (1 - Math.pow(1-k, 3))) + ' m'; if (k < 1) requestAnimationFrame(f) })(t0) };
    U.sfx.drumroll(2.4);
    setTimeout(() => show('p3', U.sfx.hit), 2600);
    setTimeout(() => show('p2', U.sfx.hit), 3700);
    setTimeout(() => { show('p1', U.sfx.fanfare); U.confetti(); const h = $('#fh'); if (h && r[0]) h.textContent = r[0].name + ' knows Rafael best.' }, 5000);
    setTimeout(() => { const b = $('#board'); if (b) b.classList.add('in') }, 5900);
  }
}

function renderSetup(){
  ui.innerHTML = `<div class="page"><div class="wrap">
    <div class="row" style="justify-content:space-between"><span class="logo">Altitude<span>.</span></span><span class="lbl">Flight plan</span></div>
    <h1 style="font-size:44px;margin:24px 0 8px">Your questions</h1>
    <p class="muted" style="font-size:18px;margin:0">Number rounds score by closeness, like Plain. Word rounds take accepted spellings and near misses (half points). The fact line shows on the reveal; it's your cue to tell the story.</p>
    ${net.live ? '' : '<div class="warn">Offline rehearsal mode: Firebase isn\'t connected yet, so phones can\'t join. You can still test with "Add test players".</div>'}
    <div id="qs"></div>
    <div class="card row" style="margin-top:16px;justify-content:space-between;padding:18px 22px">
      <div class="row"><button class="btn ghost" id="add">Add question</button>
      <label class="muted row" style="gap:10px">Seconds per round <input class="field" id="secs" type="number" min="5" max="90" value="${secs}" style="width:96px;min-height:48px;padding:8px 12px"></label></div>
      <button class="btn" id="open">Open boarding</button></div>
    <p id="err" class="muted"></p></div></div>`;
  const qs = $('#qs');
  qs.innerHTML = Q.map((q,i) => `<div class="card q" data-i="${i}">
    <div class="row" style="justify-content:space-between"><span class="lbl">Round ${i+1}</span><button class="link" data-del="${i}">Remove</button></div>
    <div class="g2"><label>Type<select class="field" data-k="type"><option value="number"${q.type==='number'?' selected':''}>Number</option><option value="year"${q.type==='year'?' selected':''}>Year</option><option value="word"${q.type==='word'?' selected':''}>Word</option></select></label>
      <label>Correct answer<input class="field" data-k="answer" value="${esc(q.answer)}"></label><label>Unit (e.g. cities)<input class="field" data-k="unit" value="${esc(q.unit)}"></label></div>
    <label>Question<input class="field" data-k="prompt" value="${esc(q.prompt)}"></label>
    <label>Fact shown on the reveal<input class="field" data-k="fact" value="${esc(q.fact||'')}"></label>
    ${q.type==='word' ? `<div class="g2"><label>Also accept (commas)<input class="field" data-k="accept" value="${esc(q.accept)}"></label><label>Near misses, half points<input class="field" data-k="near" value="${esc(q.near)}"></label></div>` : ''}
    <label class="chk"><input type="checkbox" data-k="golden"${q.golden?' checked':''}> Golden round (points ×2)</label>
    ${BUNDLED[q.id] ? `<div class="ph"><span class="muted" style="font-size:14px">Built-in story slide (works on any computer):</span><img src="${BUNDLED[q.id]}" alt="" style="width:260px;border-radius:10px"></div>` : ''}
    <div class="ph" ${BUNDLED[q.id] ? 'hidden' : ''}><div class="row" style="justify-content:space-between"><span class="muted" style="font-size:14px">Story photos appear as a polaroid wall after the reveal while you talk. Add a short caption to each (optional). Stored only in this browser.</span>
      <label class="btn ghost" style="min-height:44px;font-size:15px;display:inline-flex;align-items:center;cursor:pointer">Add photos<input type="file" accept="image/*" multiple data-photos="${q.id}" hidden></label></div>
      <div class="thumbs">${(PH[q.id]||[]).map((p,j) => `<span><img src="${p.u}" alt=""><button data-rm="${q.id}" data-j="${j}" aria-label="Remove photo">×</button><input class="pc" data-cap="${q.id}" data-j="${j}" maxlength="28" placeholder="Caption" value="${esc(p.cap)}"></span>`).join('') || '<span class="muted" style="font-size:14px">No photos: this round goes straight to the next one.</span>'}</div></div></div>`).join('');
  qs.oninput = qs.onchange = e => { const c = e.target.closest('.q'), k = e.target.dataset.k; if (!c || !k) return;
    Q[+c.dataset.i][k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; saveQ(); if (k === 'type' && e.type === 'change') renderSetup() };
  qs.onclick = async e => { const d = e.target.dataset.del; if (d != null) { Q.splice(+d,1); saveQ(); renderSetup() }
    const rm = e.target.dataset.rm; if (rm) { const b = (await IDB.get(rm)).map(norm1); b.splice(+e.target.dataset.j, 1); await IDB.set(rm, b); await loadPhotos(); renderSetup() } };
  qs.addEventListener('change', async e => {
    const cid = e.target.dataset.cap; if (cid) { const items = (await IDB.get(cid)).map(norm1); if (items[+e.target.dataset.j]) { items[+e.target.dataset.j].cap = e.target.value.trim(); await IDB.set(cid, items); PH[cid][+e.target.dataset.j].cap = e.target.value.trim() } return }
    const id = e.target.dataset.photos; if (!id) return; const files = [...e.target.files];
    e.target.closest('.ph').querySelector('.thumbs').innerHTML = '<span class="muted">Adding photos…</span>';
    const add = (await Promise.all(files.map(shrink))).filter(Boolean).map(b => ({b, cap:''})); const b = (await IDB.get(id)).map(norm1); await IDB.set(id, b.concat(add)); await loadPhotos(); renderSetup() });
  $('#add').onclick = () => { Q.push({id:U.rid(6),type:'number',prompt:'',answer:'',unit:'',fact:'',accept:'',near:'',golden:false}); saveQ(); renderSetup() };
  $('#secs').oninput = e => { secs = Math.max(5, Math.min(90, +e.target.value || 20)); saveQ() };
  $('#open').onclick = () => { if (!Q.length || Q.some(q => !q.prompt.trim() || !String(q.answer).trim())) { $('#err').textContent = 'Every question needs a question and an answer.'; return } openLobby() };
}
ui.addEventListener('click', e => { U.sfx.unlock(); const b = e.target.closest('#snd'); if (b) { const m = U.sfx.toggle(); b.innerHTML = U.speakerSVG(m); if (!m && S.phase !== 'setup' && S.phase !== 'lobby' && S.phase !== 'final') U.sfx.hum(true) } });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || S.phase === 'setup') return;
  if (![' ','ArrowRight','PageDown','Enter'].includes(e.key)) return; e.preventDefault(); U.sfx.unlock();
  if (S.phase === 'lobby' && Object.keys(pilots()).length) start(0);
  else if (S.phase === 'q') reveal();
  else if (S.phase === 'reveal') advance();
  else if (S.phase === 'story') next();
});
loadPhotos().then(() => render());
listen(); render(); if (S.code && S.phase !== 'setup') publish();
}
</script>
</body>
</html>
